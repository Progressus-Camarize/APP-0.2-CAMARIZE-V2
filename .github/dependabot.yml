version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /front-react
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
